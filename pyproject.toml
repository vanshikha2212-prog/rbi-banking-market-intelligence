[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rbi-banking-market-intelligence"
version = "3.0.0"
description = "Extended RBI MPC event study with official NSE data and leakage-free walk-forward prediction"
requires-python = ">=3.11,<3.14"
dynamic = ["dependencies"]

[project.scripts]
rbi-study = "rbi_intelligence.cli:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["rbi_intelligence*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

